{% extends 'twitter/base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] px-4">
    <!-- Main Card -->
    <div class="w-full max-w-[400px] bg-white dark:bg-gray-800 p-10 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700">
        
        <!-- Central Logo -->
        <div class="flex justify-center mb-8">
            <svg viewBox="0 0 24 24" class="h-10 w-10 fill-current text-blue-500">
                <g><path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"></path></g>
            </svg>
        </div>

        <h2 class="text-3xl font-black mb-10 text-center dark:text-white tracking-tight">Entrar no Twitter</h2>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div class="space-y-1">
                <input type="text" name="username" placeholder="Usuário" required 
                class="w-full bg-transparent border border-gray-300 dark:border-gray-600 p-4 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-all placeholder-gray-500">
            </div>

            <div class="relative space-y-1">
                <input type="password" name="password" id="id_password" placeholder="Senha" required 
                class="w-full bg-transparent border border-gray-300 dark:border-gray-600 p-4 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-all placeholder-gray-500">
                <button type="button" onclick="togglePass('id_password')" class="absolute right-4 top-4 text-gray-500">
                    <span id="eye-id_password"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 0 1 0-1.113ZM17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z" clip-rule="evenodd" /></svg></span>
                </button>
            </div>

            <button type="submit" class="w-full bg-black dark:bg-white text-white dark:text-black font-bold py-4 rounded-full hover:opacity-90 transition-all shadow-md active:scale-95">
                Entrar
            </button>
        </form>

        <div class="mt-10 text-center">
            <p class="text-gray-600 dark:text-gray-400 text-sm">
                Não tem uma conta? <a href="{% url 'signup' %}" class="text-blue-500 hover:underline font-bold ml-1">Inscreva-se</a>
            </p>
        </div>
    </div>
</div>

<script>
    function togglePass(id) {
        const input = document.getElementById(id);
        const eye = document.getElementById('eye-' + id);
        if (input.type === 'password') {
            input.type = 'text'; eye.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6"><path d="M3.53 2.47a.75.75 0 0 0-1.06 1.06l18 18a.75.75 0 1 0 1.06-1.06l-18-18ZM22.676 12.553a11.249 11.249 0 0 1-2.631 4.31l-3.099-3.099a5.25 5.25 0 0 0-6.71-6.71L7.759 4.577a11.217 11.217 0 0 1 4.242-.827c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113Z" /><path d="M15.75 12c0 .18-.013.357-.037.53l-4.244-4.243A3.75 3.75 0 0 1 15.75 12ZM12.53 15.713l-4.243-4.244a3.75 3.75 0 0 0 4.244 4.243Z" /><path d="M6.75 12c0-.619.107-1.213.304-1.764l-3.1-3.1a11.25 11.25 0 0 0-2.63 4.31c-.12.362-.12.752 0 1.114 1.489 4.467 5.704 7.69 10.675 7.69 1.5 0 2.933-.294 4.242-.827l-2.477-2.477A5.25 5.25 0 0 1 6.75 12Z" /></svg>';
        } else {
            input.type = 'password'; eye.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 0 1 0-1.113ZM17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z" clip-rule="evenodd" /></svg>';
        }
    }
</script>
{% endblock %}
