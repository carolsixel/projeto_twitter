{% extends 'twitter/base.html' %}
{% block content %}
<div class="p-4 border-b flex items-center space-x-4">
    <a href="javascript:history.back()" class="text-xl"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6"><path fill-rule="evenodd" d="M11.03 3.97a.75.75 0 0 1 0 1.06l-6.22 6.22H21a.75.75 0 0 1 0 1.5H4.81l6.22 6.22a.75.75 0 1 1-1.06 1.06l-7.5-7.5a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" /></svg></a>
    <h2 class="text-xl font-bold">{{ title }}</h2>
</div>
<div class="divide-y">
    {% for u in users %}
    <div class="p-4 flex items-center space-x-3">
        <img src="{{ u.profile_pic.url }}" class="h-12 w-12 rounded-full">
        <div>
            <a href="{% url 'profile' u.username %}" class="font-bold hover:underline block">{{ u.username }}</a>
            <span class="text-gray-500 text-sm">@{{ u.username }}</span>
        </div>
    </div>
    {% empty %}
    <p class="p-4 text-gray-500">Ninguém por aqui ainda.</p>
    {% endfor %}
</div>
{% endblock %}
